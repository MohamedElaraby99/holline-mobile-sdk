name: holline_sdk
description: Open a company's Holline call screen inside a Flutter app.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: cloud.holline.sdk.flutter
        pluginClass: HollineSdkPlugin
      ios:
        pluginClass: HollineSdkPlugin
