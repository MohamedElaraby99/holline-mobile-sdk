# Builds the SDK for every platform. iOS can only be compiled on a Mac, so
# this is the check for that code. The Android library is attached as an artifact.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['*']

jobs:
  copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wrapper copies match the native SDK
        run: |
          sh scripts/sync-wrappers.sh
          git diff --exit-code

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew :holline-sdk:testDebugUnitTest :holline-sdk:lintDebug :holline-sdk:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: holline-sdk-android
          if-no-files-found: error
          path: android/holline-sdk/build/outputs/aar/*.aar

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -scheme HollineSDK -destination 'generic/platform=iOS Simulator' build

  flutter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze and test
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build inside a new app
        run: |
          flutter create --org cloud.holline.ci --platforms=android,ios "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          flutter pub add holline_sdk --path "$GITHUB_WORKSPACE/flutter"
          flutter build apk --debug
          flutter build ios --simulator --debug

  react-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build inside a new app
        run: |
          npm pack ./react-native --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npx --yes @react-native-community/cli@latest init RnApp --directory app --skip-git-init --install-pods false
          cd app
          npm install "$RUNNER_TEMP"/holline-react-native-*.tgz
          (cd android && ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a)
          (cd ios && bundle install && bundle exec pod install)
          xcodebuild -workspace ios/RnApp.xcworkspace -scheme RnApp -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
